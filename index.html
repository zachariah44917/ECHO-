<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060a;font-family:Arial,sans-serif}
canvas{display:block}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#e8f7ff;background:rgba(0,0,0,.45)}
h1{font-size:64px;letter-spacing:8px;margin:0;color:#7ef9ff;text-shadow:0 0 20px #38d9ff}
p{opacity:.9}
button{margin-top:18px;padding:12px 22px;border:0;border-radius:12px;background:#38d9ff;color:#001018;font-weight:700;font-size:18px}
#hud{position:absolute;top:16px;left:16px;color:white;font-weight:700}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
<div id="overlay">
  <h1>ECHO</h1>
  <p>Dodge obstacles. Collect echo orbs. Survive.</p>
  <button id="start">Start</button>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener('resize',resize);resize();

const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay');
const startBtn=document.getElementById('start');

let best=+localStorage.getItem('echo_best')||0;
bestEl.textContent=best;

let player, obstacles, orbs, score, speed, running, frame;

function reset(){
  player={x:120,y:canvas.height/2,r:16,vy:0};
  obstacles=[]; orbs=[]; score=0; speed=5; frame=0;
}

function spawnObstacle(){
  const h=80+Math.random()*180;
  const gap=170;
  const y=Math.random()*(canvas.height-gap-h);
  obstacles.push({x:canvas.width+40,w:34,top:y,bottom:y+gap+h});
}

function spawnOrb(){
  orbs.push({x:canvas.width+20,y:60+Math.random()*(canvas.height-120),r:8});
}

function update(){
  frame++;
  player.vy+=0.55;
  player.y+=player.vy;

  if(player.y<player.r){player.y=player.r;player.vy=0;}
  if(player.y>canvas.height-player.r){gameOver();}

  if(frame%90===0) spawnObstacle();
  if(frame%140===0) spawnOrb();

  obstacles.forEach(o=>o.x-=speed);
  orbs.forEach(o=>o.x-=speed);

  obstacles=obstacles.filter(o=>o.x+o.w>0);
  orbs=orbs.filter(o=>o.x+o.r>0);

  for(const o of obstacles){
    if(player.x+player.r>o.x && player.x-player.r<o.x+o.w){
      if(player.y-player.r<o.top || player.y+player.r>o.bottom){
        gameOver();
      }
    }
    if(!o.passed && o.x+o.w<player.x){
      o.passed=true;
      score++;
      scoreEl.textContent=score;
      if(score%8===0) speed+=0.35;
    }
  }

  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i];
    const dx=player.x-o.x, dy=player.y-o.y;
    if(Math.hypot(dx,dy)<player.r+o.r){
      score+=3;
      scoreEl.textContent=score;
      orbs.splice(i,1);
    }
  }
}

function draw(){
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,'#05060a');
  g.addColorStop(1,'#0b1020');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // stars
  ctx.fillStyle='rgba(255,255,255,.18)';
  for(let i=0;i<50;i++){
    ctx.fillRect((i*97+frame)%canvas.width,(i*53)%canvas.height,2,2);
  }

  // player
  ctx.beginPath();
  ctx.fillStyle='#7ef9ff';
  ctx.shadowColor='#38d9ff';
  ctx.shadowBlur=18;
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;

  // obstacles
  ctx.fillStyle='#1f2a44';
  obstacles.forEach(o=>{
    ctx.fillRect(o.x,0,o.w,o.top);
    ctx.fillRect(o.x,o.bottom,o.w,canvas.height-o.bottom);
  });

  // orbs
  ctx.fillStyle='#9bffb0';
  orbs.forEach(o=>{
    ctx.beginPath();
    ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fill();
  });
}

function loop(){
  if(!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

function gameOver(){
  running=false;
  if(score>best){
    best=score;
    localStorage.setItem('echo_best',best);
    bestEl.textContent=best;
  }
  overlay.style.display='flex';
  overlay.querySelector('p').textContent='Game over. Score: '+score+' • Best: '+best;
  startBtn.textContent='Play Again';
}

function jump(){ if(running) player.vy=-9; }

addEventListener('keydown',e=>{
  if(e.code==='Space' || e.code==='ArrowUp'){ e.preventDefault(); jump(); }
});
addEventListener('pointerdown',jump);

startBtn.onclick=()=>{
  reset();
  overlay.style.display='none';
  running=true;
  loop();
};

reset();
draw();
</script>
</body>
</html>
