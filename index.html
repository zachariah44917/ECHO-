<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO: The Pulse</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060a;font-family:Arial,sans-serif}
canvas{display:block}
#ui{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;font-weight:700}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle,#111827,#05060a);color:white}
h1{font-size:64px;letter-spacing:8px;color:#7ef9ff;margin:0;text-shadow:0 0 24px #38d9ff}
button{margin-top:18px;padding:12px 22px;border:0;border-radius:12px;background:#38d9ff;color:#001018;font-weight:800}
#hint{opacity:.8;margin-top:10px;text-align:center;max-width:320px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div>Score <span id="score">0</span></div><div>Echo <span id="echo">3</span></div></div>
<div id="overlay">
<h1>ECHO</h1>
<div id="hint">Swipe left/right to change lanes. Tap the ECHO button to reveal hidden obstacles.</div>
<button id="start">Start Run</button>
</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight;}resize();addEventListener('resize',resize);

const lanes=[-1,0,1];
let lane=1,targetLane=1,playerY,speed,score,echoes,pulse,obstacles,orbs,frame,running;

function reset(){
 lane=1;targetLane=1;playerY=c.height-120;speed=10;score=0;echoes=3;pulse=0;frame=0;
 obstacles=[];orbs=[];running=true;
 document.getElementById('score').textContent=0;
 document.getElementById('echo').textContent=echoes;
}

function spawnObstacle(){
 const l=Math.floor(Math.random()*3);
 obstacles.push({lane:l,z:1,hidden:Math.random()<0.8});
}
function spawnOrb(){
 const l=Math.floor(Math.random()*3);
 orbs.push({lane:l,z:1});
}

function laneX(i){
 const center=c.width/2;
 return center + lanes[i]*120;
}

function update(){
 frame++;
 if(frame%40===0)spawnObstacle();
 if(frame%110===0)spawnOrb();
 if(frame%180===0)speed+=0.4;

 lane += (targetLane-lane)*0.18;
 if(pulse>0)pulse--;

 obstacles.forEach(o=>o.z-=0.03*speed/10);
 orbs.forEach(o=>o.z-=0.03*speed/10);

 obstacles=obstacles.filter(o=>o.z>-0.1);
 orbs=orbs.filter(o=>o.z>-0.1);

 for(const o of obstacles){
   if(o.z<0.12 && Math.round(lane)===o.lane){
     running=false;
     document.getElementById('overlay').style.display='flex';
     document.getElementById('hint').textContent='Run over. Score: '+score;
     document.getElementById('start').textContent='Play Again';
   }
   if(!o.passed && o.z<0){
     o.passed=true;
     score++;
     document.getElementById('score').textContent=score;
   }
 }

 for(let i=orbs.length-1;i>=0;i--){
   const o=orbs[i];
   if(o.z<0.12 && Math.round(lane)===o.lane){
     echoes=Math.min(5,echoes+1);
     document.getElementById('echo').textContent=echoes;
     orbs.splice(i,1);
   }
 }
}

function drawRoad(){
 ctx.fillStyle='#070b16';
 ctx.fillRect(0,0,c.width,c.height);
 const cx=c.width/2;
 ctx.strokeStyle='rgba(80,180,255,.15)';
 ctx.lineWidth=2;
 for(let i=0;i<20;i++){
   const y=c.height-i*50-(frame*2%50);
   ctx.beginPath();
   ctx.moveTo(cx-180+i*2,y);
   ctx.lineTo(cx+180-i*2,y);
   ctx.stroke();
 }
 for(let l=-1;l<=1;l++){
   ctx.beginPath();
   ctx.moveTo(cx+l*120,0);
   ctx.lineTo(cx+l*40,c.height);
   ctx.stroke();
 }
}

function draw(){
 drawRoad();

 if(pulse>0){
   ctx.beginPath();
   ctx.strokeStyle='rgba(126,249,255,.25)';
   ctx.lineWidth=6;
   ctx.arc(laneX(Math.round(lane)),playerY,220-pulse*2,0,Math.PI*2);
   ctx.stroke();
 }

 obstacles.forEach(o=>{
   const x=laneX(o.lane);
   const y=playerY-(1-o.z)*650;
   const size=30+120*(1-o.z);
   ctx.fillStyle=(pulse>0||!o.hidden)?'#ff5d7a':'rgba(255,93,122,.12)';
   ctx.fillRect(x-size/2,y-size,size,size);
 });

 orbs.forEach(o=>{
   const x=laneX(o.lane);
   const y=playerY-(1-o.z)*650;
   const r=8+18*(1-o.z);
   ctx.beginPath();
   ctx.fillStyle='#9bffb0';
   ctx.arc(x,y,r,0,Math.PI*2);
   ctx.fill();
 });

 ctx.shadowColor='#38d9ff';
 ctx.shadowBlur=24;
 ctx.beginPath();
 ctx.fillStyle='#7ef9ff';
 ctx.arc(laneX(Math.round(lane)),playerY,18,0,Math.PI*2);
 ctx.fill();
 ctx.shadowBlur=0;
}

function loop(){
 if(!running)return;
 update();
 draw();
 requestAnimationFrame(loop);
}

let touchStartX=0;
addEventListener('touchstart',e=>touchStartX=e.touches[0].clientX);
addEventListener('touchend',e=>{
 const dx=e.changedTouches[0].clientX-touchStartX;
 if(Math.abs(dx)>40){
   if(dx>0)targetLane=Math.min(2,targetLane+1);
   else targetLane=Math.max(0,targetLane-1);
 }else{
   if(echoes>0){
     echoes--;
     document.getElementById('echo').textContent=echoes;
     pulse=80;
   }
 }
});

addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft')targetLane=Math.max(0,targetLane-1);
 if(e.key==='ArrowRight')targetLane=Math.min(2,targetLane+1);
 if((e.key==='e'||e.key==='E')&&echoes>0){
   echoes--;
   document.getElementById('echo').textContent=echoes;
   pulse=80;
 }
});

document.getElementById('start').onclick=()=>{
 reset();
 document.getElementById('overlay').style.display='none';
 loop();
};

draw();
</script>
</body>
</html>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060a;font-family:Arial,sans-serif}
canvas{display:block}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#e8f7ff;background:rgba(0,0,0,.45)}
h1{font-size:64px;letter-spacing:8px;margin:0;color:#7ef9ff;text-shadow:0 0 20px #38d9ff}
p{opacity:.9}
button{margin-top:18px;padding:12px 22px;border:0;border-radius:12px;background:#38d9ff;color:#001018;font-weight:700;font-size:18px}
#hud{position:absolute;top:16px;left:16px;color:white;font-weight:700}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
<div id="overlay">
  <h1>ECHO</h1>
  <p>Dodge obstacles. Collect echo orbs. Survive.</p>
  <button id="start">Start</button>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
addEventListener('resize',resize);resize();

const scoreEl=document.getElementById('score');
const bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay');
const startBtn=document.getElementById('start');

let best=+localStorage.getItem('echo_best')||0;
bestEl.textContent=best;

let player, obstacles, orbs, score, speed, running, frame;

function reset(){
  player={x:120,y:canvas.height/2,r:16,vy:0};
  obstacles=[]; orbs=[]; score=0; speed=5; frame=0;
}

function spawnObstacle(){
  const h=80+Math.random()*180;
  const gap=170;
  const y=Math.random()*(canvas.height-gap-h);
  obstacles.push({x:canvas.width+40,w:34,top:y,bottom:y+gap+h});
}

function spawnOrb(){
  orbs.push({x:canvas.width+20,y:60+Math.random()*(canvas.height-120),r:8});
}

function update(){
  frame++;
  player.vy+=0.55;
  player.y+=player.vy;

  if(player.y<player.r){player.y=player.r;player.vy=0;}
  if(player.y>canvas.height-player.r){gameOver();}

  if(frame%90===0) spawnObstacle();
  if(frame%140===0) spawnOrb();

  obstacles.forEach(o=>o.x-=speed);
  orbs.forEach(o=>o.x-=speed);

  obstacles=obstacles.filter(o=>o.x+o.w>0);
  orbs=orbs.filter(o=>o.x+o.r>0);

  for(const o of obstacles){
    if(player.x+player.r>o.x && player.x-player.r<o.x+o.w){
      if(player.y-player.r<o.top || player.y+player.r>o.bottom){
        gameOver();
      }
    }
    if(!o.passed && o.x+o.w<player.x){
      o.passed=true;
      score++;
      scoreEl.textContent=score;
      if(score%8===0) speed+=0.35;
    }
  }

  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i];
    const dx=player.x-o.x, dy=player.y-o.y;
    if(Math.hypot(dx,dy)<player.r+o.r){
      score+=3;
      scoreEl.textContent=score;
      orbs.splice(i,1);
    }
  }
}

function draw(){
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,'#05060a');
  g.addColorStop(1,'#0b1020');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // stars
  ctx.fillStyle='rgba(255,255,255,.18)';
  for(let i=0;i<50;i++){
    ctx.fillRect((i*97+frame)%canvas.width,(i*53)%canvas.height,2,2);
  }

  // player
  ctx.beginPath();
  ctx.fillStyle='#7ef9ff';
  ctx.shadowColor='#38d9ff';
  ctx.shadowBlur=18;
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();
  ctx.shadowBlur=0;

  // obstacles
  ctx.fillStyle='#1f2a44';
  obstacles.forEach(o=>{
    ctx.fillRect(o.x,0,o.w,o.top);
    ctx.fillRect(o.x,o.bottom,o.w,canvas.height-o.bottom);
  });

  // orbs
  ctx.fillStyle='#9bffb0';
  orbs.forEach(o=>{
    ctx.beginPath();
    ctx.arc(o.x,o.y,o.r,0,Math.PI*2);
    ctx.fill();
  });
}

function loop(){
  if(!running) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

function gameOver(){
  running=false;
  if(score>best){
    best=score;
    localStorage.setItem('echo_best',best);
    bestEl.textContent=best;
  }
  overlay.style.display='flex';
  overlay.querySelector('p').textContent='Game over. Score: '+score+' • Best: '+best;
  startBtn.textContent='Play Again';
}

function jump(){ if(running) player.vy=-9; }

addEventListener('keydown',e=>{
  if(e.code==='Space' || e.code==='ArrowUp'){ e.preventDefault(); jump(); }
});
addEventListener('pointerdown',jump);

startBtn.onclick=()=>{
  reset();
  overlay.style.display='none';
  running=true;
  loop();
};

reset();
draw();
</script>
</body>
</html>
