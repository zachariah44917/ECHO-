<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO: Version 4</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#05060a;font-family:Arial,sans-serif}
canvas{display:block}
#ui{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;color:#fff;font-size:20px}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;background:rgba(0,0,0,.35)}
button{font-size:20px;padding:14px 24px;border:none;border-radius:12px;background:#61dafb;color:#001018}
#hint{opacity:.8;margin-top:10px;text-align:center;max-width:320px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"><div>Score <span id="score">0</span></div><div>Echo <span id="echo">3</span></div></div>
<div id="overlay">
<h1>ECHO</h1>
<div id="hint">Swipe left/right to change lanes. Tap the ECHO button to reveal hidden obstacles for a moment.</div>
<button id="start">Start Run</button>
</div>
<script>
const c=document.getElementById('game'),x=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight}
addEventListener('resize',resize);resize();

let lane=1,score=0,echo=3,running=false,speed=6;
const lanes=[0.2,0.5,0.8];
let obstacles=[],reveal=0;

function spawn(){
  obstacles.push({lane:Math.floor(Math.random()*3),y:-40,hidden:Math.random()<0.5});
}

function drawPlayer(){
  const px=c.width*lanes[lane],py=c.height-120;
  x.fillStyle='#7ef9ff';
  x.beginPath();x.arc(px,py,18,0,Math.PI*2);x.fill();
}

function drawOb(o){
  const ox=c.width*lanes[o.lane];
  const visible=!o.hidden||reveal>0;
  if(!visible){
    x.strokeStyle='rgba(255,255,255,.18)';
    x.strokeRect(ox-18,o.y-18,36,36);
    return;
  }
  x.fillStyle='#ff5a7a';
  x.fillRect(ox-18,o.y-18,36,36);
}

function reset(){
  lane=1;score=0;echo=3;speed=6;obstacles=[];reveal=0;
  document.getElementById('score').textContent=0;
  document.getElementById('echo').textContent=3;
}

function loop(){
  if(!running)return;
  x.clearRect(0,0,c.width,c.height);

  x.strokeStyle='rgba(255,255,255,.08)';
  for(const p of lanes){
    x.beginPath();
    x.moveTo(c.width*p,c.height);
    x.lineTo(c.width*p,0);
    x.stroke();
  }

  if(Math.random()<0.02+score/5000)spawn();

  for(const o of obstacles){
    o.y+=speed;
    drawOb(o);
    const px=c.width*lanes[lane],py=c.height-120,ox=c.width*lanes[o.lane];
    if(Math.abs(o.y-py)<24&&Math.abs(ox-px)<22){
      running=false;
      document.getElementById('overlay').style.display='flex';
      document.getElementById('start').textContent='Restart';
      return;
    }
  }

  obstacles=obstacles.filter(o=>o.y<c.height+40);
  drawPlayer();

  score++;
  if(score%600===0)speed+=0.5;
  document.getElementById('score').textContent=score;
  if(reveal>0)reveal--;

  requestAnimationFrame(loop);
}

document.getElementById('start').onclick=()=>{
  reset();
  running=true;
  document.getElementById('overlay').style.display='none';
  requestAnimationFrame(loop);
};

let sx=0;
addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx;
  if(dx>30)lane=Math.min(2,lane+1);
  if(dx<-30)lane=Math.max(0,lane-1);
});

addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft')lane=Math.max(0,lane-1);
  if(e.key==='ArrowRight')lane=Math.min(2,lane+1);
  if((e.key===' '||e.key==='e')&&echo>0){
    echo--;
    reveal=180;
    document.getElementById('echo').textContent=echo;
  }
});

const b=document.createElement('button');
b.textContent='ECHO';
b.style.position='absolute';
b.style.bottom='24px';
b.style.right='24px';
b.onclick=()=>{
  if(echo>0){
    echo--;
    reveal=180;
    document.getElementById('echo').textContent=echo;
  }
};
document.body.appendChild(b);
</script>
</body>
</html>
